<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>自社メディア進捗 — Tak CMO</title>
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>

<header class="header">
  <div class="header-top">
    <div class="header-left">
      <h1>自社メディア進捗</h1>
      <span class="badge" id="save-status">読込中</span>
    </div>
    <span class="today-badge" id="today-label"></span>
  </div>
  <div class="cadence-bar" id="cadence-bar"></div>
  <p class="rule-banner">ルール：全メディア<strong>公開の1週間前</strong>までに投稿完了状態にする</p>
  <div class="header-actions">
    <button type="button" class="btn btn-ghost" id="btn-sync" title="共有JSONを取得">🔄 更新</button>
    <button type="button" class="btn btn-ghost" id="btn-export">📥 保存</button>
    <label class="btn btn-ghost file-btn">
      📤 取込
      <input type="file" id="import-file" accept=".json" hidden>
    </label>
    <button type="button" class="btn btn-primary" id="btn-add-week">＋ 週を追加</button>
  </div>
</header>

<nav class="tabs" role="tablist">
  <button type="button" class="tab active" data-tab="week">📆 今週</button>
  <button type="button" class="tab" data-tab="alerts">🔔 アラート</button>
  <button type="button" class="tab" data-tab="month">📅 月間</button>
  <button type="button" class="tab" data-tab="list">📋 一覧</button>
  <button type="button" class="tab" data-tab="dash">📊 概要</button>
</nav>

<main class="main" id="main"></main>

<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-labelledby="modal-title">
    <div class="modal-hd">
      <h2 id="modal-title">編集</h2>
      <button type="button" class="modal-close" id="btn-close-modal" aria-label="閉じる">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-ft">
      <button type="button" class="btn btn-danger btn-sm" id="btn-delete-slot" hidden>削除</button>
      <button type="button" class="btn btn-neutral" id="btn-cancel-modal">キャンセル</button>
      <button type="button" class="btn btn-primary" id="btn-save-modal">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="app.js?v=3"></script>
</body>
</html>
